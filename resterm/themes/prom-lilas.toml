# Prom-Wiki 2026 Dark — tema do resterm
# Segue a extensão VSCode keveenmenezes.prometheus (prom-wiki-2026-dark.json + prom-wiki-color-theme.json):
# a interface é monocromática (cinzas, destaque cinza #949494, seleção ciano a 20%) e a cor fica
# no conteúdo, com as mesmas cores dos tokens de código do VS Code.
#
# Interface
#   bg        #101010   input    #151515   widget   #212121   hover  #252525   borda  #2b2b2b
#   texto     #bfbfbf   texto+   #e0e0e0   apagado  #888888   dim    #6b6b6b   faint  #444444
#   destaque  #949494   lista    #3a3a3a (#949494 a 33%)   seleção #2f2a45 (#6fd8ff a 20%)
# Código (tokens do VS Code)
#   keyword   #ffa07f   tipo     #ffb86b   função   #7fe3ee   string #b2d99a   const  #c3a6e0
#   variável  #e0e0e0   operador #888888   comentário #6b6b6b
# Estado
#   erro      #f47c7c   sucesso  #b2d99a   aviso    #ffd59a

[metadata]
name = "Prom-Lilas"
description = "Grafite monocromático; cor só no conteúdo, como o Prometheus do VS Code"
author = "Keveen Menezes"
version = "2.0.0"
tags = ["dark", "prometheus", "pastel"]

