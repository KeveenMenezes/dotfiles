# herdr — multiplexador de agents (~/.config/herdr/config.toml)
# Referência completa: herdr --default-config · validar: herdr config check
# Recarregar no servidor rodando: herdr server reload-config (ou prefix+shift+r)

onboarding = false

# ── Tema Prometheus ────────────────────────────────────────────────────────
# Base "terminal" segue a paleta ANSI do Ghostty (prom-wiki); os tokens abaixo
# trazem a paleta do promo-wiki.nvim. Fundos em "reset" mantêm a transparência.
[theme]
name = "terminal"

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#1d1d1d"
selection_bg = "#153239"
accent = "#29b8db"
surface0 = "#1d1d1d"
surface1 = "#232323"
surface_dim = "#151515"
overlay0 = "#333333"
overlay1 = "#494949"
text = "#b6b6b6"
subtext0 = "#6b6b6b"
mauve = "#a579c3"
green = "#98c379"
yellow = "#ffc066"
red = "#f44747"
blue = "#29b8db"
teal = "#23d8ea"
peach = "#ff7d4d"

[terminal]
default_shell = "/opt/homebrew/bin/nu"
new_cwd = "follow"

# ── Atalhos ────────────────────────────────────────────────────────────────
# Prefixo ctrl+a (padrão do herdr é ctrl+b) e defaults do herdr (prefix+? mostra todos).
# Popups usam caminho absoluto: o servidor sobe com o PATH mínimo do Ghostty.
[keys]
prefix = "ctrl+a"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
# alt+* é do AeroSpace (alt-1..9 workspaces, alt-h/j/k/l foco, alt-s/r/w/m modos) e ele tem
# prioridade: atalhos do herdr ficam sempre atrás do prefixo ctrl+a.
switch_workspace = "prefix+shift+1..9"
# worktrees: prefix+shift+g cria (padrão); estes abrem uma existente / removem a checkout
open_worktree = "prefix+ctrl+o"
remove_worktree = "prefix+ctrl+x"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "/opt/homebrew/bin/lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+d"
type = "popup"
command = "/opt/homebrew/bin/lazydocker"
description = "lazydocker"
width = "90%"
height = "90%"

# senhas vêm do Keychain (bin/lazysql-kc); roda no cwd da pane, então acha o .lazysql.toml do projeto
[[keys.command]]
key = "prefix+ctrl+s"
type = "popup"
command = "~/.local/bin/lazysql-kc"
description = "lazysql"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "/opt/homebrew/bin/gh dash"
description = "gh dash (PRs)"
width = "95%"
height = "90%"

# tarefas (bin/task): tarefas ativas, projetos e pastas do zoxide; ctrl-n cria, ctrl-x encerra
[[keys.command]]
key = "prefix+ctrl+t"
type = "popup"
command = "~/.local/bin/task pick"
description = "tarefas"
width = "85%"
height = "80%"

# plugin keveen.workflow (herdr/plugins/workflow): PR do branch da pane atual em popup.
# Ctrl+clique em link de PR/issue do GitHub abre o mesmo popup.
[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "keveen.workflow.current-pr"
description = "PR do branch atual"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "/opt/homebrew/bin/nu"
description = "shell flutuante"
width = "85%"
height = "80%"

# ── Interface ──────────────────────────────────────────────────────────────
[ui]
accent = "#29b8db"
tab_bar_position = "top"
# fila de atenção: agents bloqueados primeiro, depois os que terminaram
agent_panel_sort = "priority"
# formas distintas por estado (além da cor), mais fácil de ler que só os pontos
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
# título da janela do Ghostty (AeroSpace, Mission Control, cmd+tab)
window_title = "herdr · {workspace} · {tab}"

# barra de abas: zoom + cota do plano Claude (5h / 7d), gravada pelo statusLine do Claude Code
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/scripts/claude-quota.sh", interval_seconds = 30, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

# Linhas de cada agent. Para o Claude: onde está, no que está trabalhando (título do
# terminal) e modelo + contexto. O contexto chega como um de três tokens ($ctx_ok,
# $ctx_warn, $ctx_high) para cada faixa ter sua cor: verde < 50% <= laranja < 80% <= vermelho.
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", fg = "#b6b6b6" }],
  [
    { token = "$model", fg = "#6b6b6b" },
    { token = "$ctx_ok", fg = "#98c379" },
    { token = "$ctx_warn", fg = "#ff9e3b" },
    { token = "$ctx_high", fg = "#f44747", bold = true },
  ],
]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], [{ token = "branch", fg = "#a579c3" }, "git_status"]]

# notificação do macOS (via Ghostty) quando um agent em segundo plano termina ou precisa de você
[ui.toast]
delivery = "terminal"
