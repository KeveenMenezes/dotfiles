# ~/.config/tmux/tmux.conf
# Multiplexador do Ghostty para rodar vários agents (Claude Code, Codex...) em janelas/painéis.

# ── Shell / terminal ───────────────────────────────────────────────────────
set -g default-shell /opt/homebrew/bin/nu
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:usstyle"
set -ga update-environment "TERM TERM_PROGRAM"

# ── Comportamento (nvim + agents) ──────────────────────────────────────────
set -s escape-time 10              # Esc imediato no vi mode do nvim/nushell
set -g focus-events on             # autoread / autosave do nvim
set -g history-limit 100000        # agents geram muito output
set -g mouse on
set -s set-clipboard on            # OSC 52 -> clipboard do macOS
set -g allow-passthrough on        # imagens do snacks.nvim e OSCs do Ghostty
set -s extended-keys on            # Shift+Enter etc. no Claude Code
set -s extended-keys-format csi-u
set -g set-titles on
set -g set-titles-string "#S · #W"

# ── Prefixo (C-b conflita com o Ctrl+B do Claude Code) ─────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Janelas / painéis ──────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off       # matar uma sessão pula para outra em vez de fechar o Ghostty
setw -g automatic-rename on
set -g monitor-bell on             # agent que terminou fica destacado na barra
set -g bell-action any
set -g visual-bell off

# ── Keymaps ────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind N command-prompt -p "nova sessão:" "new-session -s '%%' -c '#{pane_current_path}'"

# navegação estilo vim (C-h/j/k/l ficam livres para o nvim mover buffers)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi) ─────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ── Tema ───────────────────────────────────────────────────────────────────
source-file ~/.config/tmux/themes/prometheus.conf
