# Prometheus — tema do tmux derivado do promo-wiki.nvim (palettes/dark.lua + lualine)
#
#   base     #101010   surface0 #1d1d1d   surface2 #2a2a2a   overlay1 #494949
#   subtext0 #6b6b6b   text     #b6b6b6   sky      #00d0ff   orange   #ff9e3b
#   peach    #ff7d4d   mauve    #a579c3   selection #0d3640
#
# Obs.: dentro de #{?...} os estilos usam blocos #[..] sem vírgula para não quebrar o parser.

# ── Barra ──────────────────────────────────────────────────────────────────
set -g status on
set -g status-position top         # o lualine do nvim fica embaixo
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#b6b6b6"   # transparente, como o nvim

# sessão — mesma lógica de modo do lualine: normal=sky, prefixo=peach, copy=mauve
set -g status-left-length 40
set -g status-left "#[fg=#101010]#[bold]#{?client_prefix,#[bg=#ff7d4d],#{?pane_in_mode,#[bg=#a579c3],#[bg=#00d0ff]}} \uf489 #S #[bg=default]#[nobold]#{?client_prefix,#[fg=#ff7d4d],#{?pane_in_mode,#[fg=#a579c3],#[fg=#00d0ff]}}\ue0b4 "

# janelas
set -g window-status-separator ""
set -g window-status-format "#{?window_bell_flag,#[fg=#ff9e3b]#[bold],#[fg=#6b6b6b]} #I #W#{?window_bell_flag, \U000f009e,} "
set -g window-status-current-format "#[fg=#00d0ff,bg=#1d1d1d,bold] #I #W#{?window_zoomed_flag, \U000f0293,} "
set -g window-status-bell-style "fg=#ff9e3b,bold"
set -g window-status-activity-style "fg=#ff9e3b"

# direita: comando do painel │ diretório, hora
set -g status-right-length 80
set -g status-right "#[fg=#6b6b6b]#{pane_current_command} #[fg=#2a2a2a]\u2502 #[fg=#b6b6b6]\uf07b #{b:pane_current_path} #[fg=#1d1d1d,bg=default]\ue0b6#[fg=#00d0ff,bg=#1d1d1d]\uf017 %H:%M "

# ── Painéis (igual ao colorful-winsep: borda bold #00d0ff) ─────────────────
set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#00d0ff"
set -g pane-border-lines heavy
set -g display-panes-colour "#494949"
set -g display-panes-active-colour "#00d0ff"

# ── Mensagens / modos ──────────────────────────────────────────────────────
set -g message-style "bg=#1d1d1d,fg=#00d0ff"
set -g message-command-style "bg=#1d1d1d,fg=#ff7d4d"
setw -g mode-style "bg=#0d3640,fg=#b6b6b6"
setw -g copy-mode-match-style "bg=#ff9e3b,fg=#101010"
setw -g copy-mode-current-match-style "bg=#00d0ff,fg=#101010"
setw -g clock-mode-colour "#00d0ff"

# ── Popups / menus ─────────────────────────────────────────────────────────
set -g popup-border-style "fg=#00d0ff"
set -g popup-border-lines rounded
set -g menu-style "bg=#151515,fg=#b6b6b6"
set -g menu-selected-style "bg=#0d3640,fg=#00d0ff"
set -g menu-border-style "fg=#2a2a2a"
