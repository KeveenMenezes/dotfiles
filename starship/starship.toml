"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$dotnet\
[](fg:color_blue bg:color_bg3)\
$aws\
${custom.rds_tunnel}\
$docker_context\
$conda\
$pixi\
[](fg:color_bg3 bg:color_bg1)\
$cmd_duration\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'prom_wiki'

[palettes.prom_wiki]
color_fg0   = '#e0e0e0'  # base foreground
color_bg1   = '#1a1a1a'  # deepest bg — time segment
color_bg3   = '#333333'  # mid-dark — docker/conda segment
color_orange = '#c05520'  # deep terracotta — OS/user segment
color_yellow = '#b88018'  # warm amber — directory segment (not muddy)
color_aqua   = '#1a9898'  # dark teal-cyan — git segment
color_blue   = '#1a6080'  # deep blue — lang segment
color_green  = '#98c379'  # prom-wiki green — success symbol
color_purple = '#a579c3'  # prom-wiki purple — vimcmd replace
color_red    = '#f44747'  # prom-wiki red — error symbol

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[dotnet]
symbol = "󰪮"
style = "bg:color_blue"
heuristic = true  # lê global.json/SDK sem rodar `dotnet --version` a cada prompt
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

# Perfil AWS ativo (o direnv põe AWS_PROFILE=dev nas pastas do trabalho).
[aws]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $profile) ](fg:#ff9e3b bg:color_bg3)]($style)'

# Túnel do RDS de DEV (./scripts/open-tunner-rds.sh) aberto na 14330. Só aparece com AWS_PROFILE=dev.
[custom.rds_tunnel]
when = '[ "$AWS_PROFILE" = dev ] && nc -z -G 1 127.0.0.1 14330 >/dev/null 2>&1'
shell = ["sh"]
symbol = "󰆼"
style = "bg:color_bg3"
format = '[[ $symbol rds ](fg:color_green bg:color_bg3)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

# Duração de comandos com mais de 3s (build, dotnet test).
[cmd_duration]
min_time = 3000
style = "bg:color_bg1"
format = '[[ 󱦟 $duration ](fg:color_yellow bg:color_bg1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
