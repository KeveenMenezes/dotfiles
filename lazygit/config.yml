# Diff com delta (git config: core.pager). Backup em ~/.config/backup-terminal-20261113/
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --line-numbers
gui:
  # >>> tema
  theme:
    activeBorderColor: ["#949494", bold]
    inactiveBorderColor: ["#2b2b2b"]
    searchingActiveBorderColor: ["#ffc066", bold]
    optionsTextColor: ["#888888"]
    selectedLineBgColor: ["#3a3a3a"]
    inactiveViewSelectedLineBgColor: ["#252525"]
    cherryPickedCommitFgColor: ["#23d8ea"]
    cherryPickedCommitBgColor: ["#2b2b2b"]
    markedBaseCommitFgColor: ["#23d8ea"]
    markedBaseCommitBgColor: ["#ffc066"]
    unstagedChangesColor: ["#f44747"]
    defaultFgColor: ["#bfbfbf"]
  # <<< tema
  nerdFontsVersion: "3"
  showFileTree: true
os:
  editPreset: nvim
