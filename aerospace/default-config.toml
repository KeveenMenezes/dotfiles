after-startup-command = [
    'exec-and-forget open -a Ghostty',
    'exec-and-forget open -a Obsidian',
    'exec-and-forget open -a Atlas',
]

exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE && sketchybar --trigger windows_on_spaces',
]

on-focus-changed = ['exec-and-forget sketchybar --trigger window_focus']
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
accordion-padding = 100

[gaps]
inner.horizontal = 8
inner.vertical = 8

outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[key-mapping]
preset = 'qwerty'

# [[on-window-detected]]
# if.app-id = 'com.apple.systempreferences'
# if.app-name-regex-substring = 'settings'
# if.window-title-regex-substring = 'substring'
# if.workspace = 'workspace-name'
# if.during-aerospace-startup = true
# check-further-callbacks = true
# run = ['layout floating', 'move-node-to-workspace S']  # The callback itself

[[on-window-detected]]
if.window-title-regex-substring = 'Picture in Picture'
run = ['layout floating', 'move-node-to-workspace scratch']

[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'camera'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'System Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Preview'
run = 'layout floating'

# Ghostty
[[on-window-detected]]
if.app-name-regex-substring = 'Ghostty'
if.workspace = 'infra'
run = 'move-node-to-workspace infra'

[[on-window-detected]]
if.app-name-regex-substring = 'Ghostty'
run = 'move-node-to-workspace code'

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = 'move-node-to-workspace web'

[[on-window-detected]]
if.app-name-regex-substring = 'Obsidian'
run = 'move-node-to-workspace obsidian'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace music'

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'secondary'
5 = 'secondary'
6 = 'secondary'
7 = 'main'
8 = 'main'
9 = 'main'

[mode.main.binding]

alt-shift-r = 'flatten-workspace-tree'
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-t = 'exec-and-forget open -a /Applications/Ghostty.app'
alt-shift-c = 'reload-config'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-f = 'fullscreen'
alt-v = 'layout tiles vertical'
alt-b = 'layout tiles horizontal'
alt-a = 'layout accordion'
alt-space = 'layout floating tiling'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-0 = 'workspace web'
alt-1 = 'workspace code'
alt-2 = 'workspace infra'
alt-3 = 'workspace term'
alt-4 = 'workspace chat'
alt-5 = 'workspace devops'
alt-6 = 'workspace music'
alt-7 = 'workspace observability'
alt-8 = 'workspace obsidian'
alt-9 = 'workspace scratch'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-0 = 'move-node-to-workspace web --focus-follows-window'
alt-shift-1 = 'move-node-to-workspace code --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace infra --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace term --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace chat --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace devops --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace music --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace observability --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace obsidian --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace scratch --focus-follows-window'

alt-s = 'mode service'
alt-r = 'mode resize'

alt-shift-i = 'exec-and-forget /Users/keveenmenezes/Documents/projects/study/dotfiles/aerospace/scripts/infra.sh'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
backspace = ['close-all-windows-but-current', 'mode main']

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
enter = 'mode main'
esc = 'mode main'
